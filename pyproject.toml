[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "jolto"
version = "0.1.0"
description = "A Python library for interest-rate derivatives under rough volatility (Rough SABR Forward Market Model)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Roberto Lucarini" }]
keywords = ["rough volatility", "SABR", "forward market model", "interest rates", "swaptions", "Monte Carlo"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jolto = "jolto.cli:main"

[project.urls]
Repository = "https://github.com/robertolucarini/jolto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["paper/notes", "fmenv"]

[tool.ruff.lint]
# pinned rule set (ruff's pre-0.17 defaults), so new ruff releases do not change what CI checks
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# the other tests/*.py are long research scripts run directly (python tests/<name>.py)
testpaths = ["tests"]
python_files = ["test_trade_specs.py", "test_engine_greeks.py", "test_simulate_curves.py", "test_cli.py", "test_closed_form.py"]
